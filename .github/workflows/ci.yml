name: CI

# Auto-runs are ON (re-enabled 2026-07-29 — they were paused 2026-07-26 through 2026-07-29).
#
# Why they are back: the project now carries FIVE self-enforcing conformance gates —
# PropertyIsolationConformanceTest, GlRegistryConformanceTest, MediaPrivacyConformanceTest,
# AdminSmokeManifestConformanceTest and DashboardLayoutConformanceTest — and every one of them
# exists because the class of bug it catches already shipped once. While auto-runs were paused
# they were ADVISORY: they only ran when somebody remembered. In that window a widget with no
# authorization gate at all reached production and published the property's receivables to the
# HR and marketing dashboards — exactly the class the gates are for. A gate nobody runs is not
# a gate.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Known-vulnerable dependencies. Cheap (no PHP deps needed beyond the lock file) and it
  # catches the class of problem nothing else here can: a CVE published against a package
  # you already have, without a single line of your code changing.
  #
  # This found 22 advisories the first time it was run (2026-07-16), incl. two HIGH — a
  # Filament MFA recovery-code reuse and a medialibrary upload-restriction bypass — plus a
  # Filament scope-enforcement CVE that lands squarely on this project's property-isolation
  # invariant. All were fixable inside the existing composer.json constraints; nobody knew
  # because nothing looked.
  security-advisories:
    name: Security advisories (composer audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Audits composer.lock directly — no install needed.
      # --locked: this job deliberately installs nothing (that is what makes it cheap), and
      # `composer audit` without it aborts with "No installed packages found" — which is how this
      # job had been failing on every run since at least 2026-07-23 without auditing anything.
      - name: composer audit
        run: composer audit --locked --no-interaction

  phpunit:
    name: Test suite (Pest, parallel)
    runs-on: ubuntu-latest
    # This budget has been wrong twice: 10 minutes killed a 10m15s serial run, then 20 minutes
    # killed a 20m15s parallel one — both reported "failure" without a single failing test, which
    # is the worst possible signal. 45 is deliberate headroom to get a REAL duration on the board
    # rather than guess a third time. 453 test files across 150 migrations, and there is no
    # `database/schema` dump, so every paratest worker replays all 150 migrations before it starts
    # — that is the thing to fix if the measured time is unacceptable (`php artisan schema:dump`).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          touch database/database.sqlite

      # `pest --parallel` is the project's canonical command (CLAUDE.md) — running something else
      # here meant CI and the developer loop could disagree about what "green" means.
      - name: Run test suite
        run: vendor/bin/pest --parallel

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      # larastan BOOTS the application to infer model relations and generics. Without an .env and
      # an app key it cannot, and silently degrades every custom model to
      # Illuminate\Database\Eloquent\Model — reporting ~11 phantom errors ("undefined property
      # Model::$unit", "undefined method HasMany::received()") that phpstan-baseline.neon, which
      # was generated WITH an .env, does not match. This step is why the gate was red for weeks
      # while passing on every developer machine.
      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          touch database/database.sqlite

      # Gate enforces NO NEW errors above the grandfathered phpstan-baseline.neon.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mall_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, mysql, gd, bcmath, exif, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: npm install
        run: npm ci

      - name: Configure env
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # `#\?` matters: .env.example ships these keys COMMENTED OUT (the Laravel 11+ default),
          # so the old `^DB_HOST=` anchors matched nothing. Only DB_CONNECTION was ever rewritten,
          # and the job then tried to reach database `laravel` as root with NO password —
          # "Access denied for user 'root'" on every run.
          sed -i -E 's|^#? *DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i -E 's|^#? *DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i -E 's|^#? *DB_PORT=.*|DB_PORT=3306|' .env
          sed -i -E 's|^#? *DB_DATABASE=.*|DB_DATABASE=mall_management_test|' .env
          sed -i -E 's|^#? *DB_USERNAME=.*|DB_USERNAME=root|' .env
          sed -i -E 's|^#? *DB_PASSWORD=.*|DB_PASSWORD=root|' .env
          # Fail loudly here rather than 40 lines later inside artisan.
          grep -q '^DB_DATABASE=mall_management_test' .env
          grep -q '^DB_PASSWORD=root' .env

      - name: Migrate + seed
        run: |
          php artisan migrate:fresh --force --seed

      - name: Build assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &> storage/logs/serve.log &
          echo $! > /tmp/serve.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/up > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storage/playwright-report
          retention-days: 7
