name: CI

# Auto-runs are disabled — CI no longer runs on every push/PR. The workflow can
# still be launched on demand from the Actions tab (Run workflow). To re-enable
# automatic CI, uncomment the push / pull_request blocks below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

jobs:
  phpunit:
    name: PHPUnit (services + math)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run PHPUnit
        run: php artisan test --testsuite=Unit,Feature

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      # Gate enforces NO NEW errors above the grandfathered phpstan-baseline.neon.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mall_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, mysql, gd, bcmath, exif, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: npm install
        run: npm ci

      - name: Configure env
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=mall_management_test|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=root|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=root|' .env

      - name: Migrate + seed
        run: |
          php artisan migrate:fresh --force --seed

      - name: Build assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &> storage/logs/serve.log &
          echo $! > /tmp/serve.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/up > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storage/playwright-report
          retention-days: 7
