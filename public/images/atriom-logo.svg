<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" preserveAspectRatio="xMidYMid meet">
  <!-- Atriom logo — AUTO-ADAPTS via prefers-color-scheme.
       Light mode: ink wordmark + teal mark + amber dot.
       Dark mode: cream wordmark + brighter teal + warmer amber.
       Use atriom-logo-light.svg / atriom-logo-dark.svg for explicit cases
       (e.g. apps that don't respect prefers-color-scheme inside <img>). -->
  <style>
    .mark { stroke: #0F766E; }
    .word { fill: #0F1419; }
    .dot { fill: #D97706; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #14B8A6; }
      .word { fill: #F5F0E8; }
      .dot { fill: #F59E0B; }
    }
  </style>
  <g transform="translate(8, 14)">
    <path class="mark" d="M 4 50 L 4 24 A 22 22 0 0 1 48 24 L 48 50"
          fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="mark" x1="14" y1="50" x2="14" y2="30" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <line class="mark" x1="38" y1="50" x2="38" y2="30" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle class="dot" cx="26" cy="10" r="3.5"/>
  </g>
  <text class="word" x="76" y="52" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="38" letter-spacing="-0.02em">atriom</text>
</svg>
